[project]
name = "ai-dpi-middleware"
version = "0.1.0"
description = "AI-powered Digital Public Infrastructure middleware"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.86.0",
    "fastapi>=0.135.2",
    "groq>=1.1.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "openai>=2.30.0",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.24",
    "redis>=7.4.0",
    "uvicorn[standard]>=0.42.0",
]

[project.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
]
