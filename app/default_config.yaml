app: 
  port: 5000
  name: "AI DPI Middleware"
  version: "0.1.0"
  debug: false

auth:
  issuers:
    - issuer: "[KEY_CLOAK_ISSUER]"
      jwks_uri: "[jwks_uri]"
      audience: "account"
      algorithm: "RS256" 
      type: "online"

    - issuer: "[INTROSPECT_ISSUER]"
      introspect_api: "api/instrospect"
      client_id: "[INTRO_ID]"
      client_secret: "[INTRO_SECRET]"
      type: "online"

    - issuer: "[LOCAL]"
      key: "[KEY]"
      type: "local"
      algorithm: HS256
      client1:
        secret: "[SECRET1]"
        roles: ["user"]
      client2:
        secret: "[SECRET2]" 
        roles: ["admin"]
      expire_minutes: 60  

llm:
  max_context_length: 131072  # Qwen 2.5 supports 32K context
  max_new_tokens: 8192  # Conservative output token limit
  temperature: 0.9 
  top_p: 0.95
  repetition_penalty: 1.05
  stop:
    - "<|im_end|>"
    - "<|end_of_text|>"

  providers:                              # This should follow the order of the model if no provider is specified.
    anthropic:
      api_key: "[ANTHROPIC_API_KEY]"
      default_model: "claude-sonnet-4-6"
      max_tokens: 8096
      kwargs:
        temperature: 0.9
        top_p: 0.95
    openai:
      api_key: "[OPENAI_API_KEY]"
      default_model: "gpt-4o"
      max_tokens: 8096
      kwargs:
        temperature: 0.9
        top_p: 0.95
    groq:
      api_key: "[GROQ_API_KEY]"
      default_model: "llama-3.3-70b-versatile"
      max_tokens: 8192
      kwargs:
        temperature: 0.9
        top_p: 0.95
    gemini:
      api_key: "[GEMINI_API_KEY]"
      default_model: "gemini-2.5-flash"
      max_tokens: 8192
      kwargs:
        temperature: 0.9
        top_p: 0.95
    generic:
      api_key: "[GENERIC_API_KEY]"
      default_model: "llama-3.3-70b-versatile"
      max_tokens: 8192
      openai_url: "https://api.groq.com/openai/v1/chat/completions"
      kwargs:
        temperature: 0.9
        top_p: 0.95
  
  vector_database:
    # Provider options: "weaviate" (open-source), "pinecone" (managed), "qdrant" (open-source + managed cloud)
    provider: "weaviate"

    # Connection type per provider:
    #   weaviate:  "http" (local Docker) | "cloud" (Weaviate Cloud) | "embedded"
    #   qdrant:    "http" (local Docker) | "cloud" (Qdrant Cloud)   | "memory"
    #   pinecone:  always cloud — only API_KEY is required
    type: "http"

    # Local / self-hosted (weaviate + qdrant)
    http_host: "localhost"
    http_port: 8080          # Weaviate default; Qdrant default is 6333
    grpc_port: 50051          # Weaviate gRPC port (v4 client requirement)

    # Weaviate Cloud / Qdrant Cloud
    cloud_host: "[CLUSTER_URL]"   # e.g. https://my-cluster.weaviate.network  |  https://xyz.us-east-1-0.aws.cloud.qdrant.io
    API_KEY: "[API_KEY]"

    # Pinecone (always cloud)
    # API_KEY above is reused for Pinecone too

    N_RESULT: 2
    collection_name: "default_collection"

  embedding_model:
    model: "text-embedding-3-small"
    provider: "openai"
    API_KEY: "[OPENAI_API_KEY]"

  rate_limit:
    user: 10                 # Chat requests per minute for `user` role
    admin: 60                # Chat requests per minute for `admin` role

  system_prompt_path: "/path/system_prompt.yaml" # If you don't want to havea system prompt
  

speech:
  max_file_size_mb: 50           # General STT file size limit (Groq, OpenAI, Deepgram)
  spitch_max_file_size_mb: 25    # Spitch and Intron file size limit

  providers:
    groq:
      api_key: "[GROQ_API_KEY]"
    openai:
      api_key: "[OPENAI_API_KEY]"
    spitch:
      api_key: "[SPITCH_API_KEY]"
    deepgram:
      api_key: "[DEEPGRAM_API_KEY]"
    elevenlabs:
      api_key: "[ELEVENLABS_API_KEY]"
    intron:
      api_key: "[INTRON_API_KEY]"
      base_url: "https://api.intron.africa/v1"

tts:
  session_ttl_hours: 24
  rate_limit:
    user: 10
    admin: 60

stt:
  session_ttl_hours: 24
  rate_limit:
    user: 10
    admin: 60

redis:
  enabled: false
  url: "[REDIS_URL]"  # Load from environment variable REDIS_URL, e.g. "redis://localhost:6379/0"
  session_prefix: "session:"
  rate_limit_prefix: "rate_limit:"

cors:
  allow_origins: ["*"]  # In production, specify allowed origins
  allow_methods: ["*"]
  allow_headers: ["*"]
  allow_credentials: true



