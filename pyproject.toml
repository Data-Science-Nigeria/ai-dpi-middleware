[project]
name = "ai-dpi-middleware"
version = "0.1.0"
description = "AI-powered Digital Public Infrastructure middleware"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "anthropic>=0.86.0",
    "deepgram-sdk>=7.1.1",
    "elevenlabs>=2.47.0",
    "fastapi>=0.135.2",
    "google-generativeai>=0.8.0",
    "groq>=1.1.2",
    "httpx>=0.28.1",
    "jwt>=1.4.0",
    "loguru>=0.7.3",
    "openai>=2.30.0",
    "packaging>=26.0",
    "pinecone>=5.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.24",
    "qdrant-client>=1.12.0",
    "redis>=7.4.0",
    "spitch>=1.47.0",
    "uvicorn[standard]>=0.42.0",
    "weaviate-client>=4.9.0",
]

[project.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
]
