document:
  pdf_folder: "./data/documents"
  min_paragraph_length: 50
  chunk_overlap_sentences: 3  # Number of sentences from previous chunk to include in next chunk
  image_folder: "./data/images"
  audio_folder: "./data/audio"
  enable_pdf_ocr: true     # Enable OCR for images inside PDFs
  extract_tables: false    # Placeholder for future table extraction

