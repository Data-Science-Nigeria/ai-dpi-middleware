app:
  port: 5000
  name: "AI DPI Middleware"
  version: "0.1.0"
  debug: false

# ── Authentication ────────────────────────────────────────────────────────────
auth:
  issuers:
    - issuer: "[KEY_CLOAK_ISSUER]"
      jwks_uri: "[jwks_uri]"
      audience: "account"
      algorithm: "RS256"
      type: "online"

    - issuer: "[INTROSPECT_ISSUER]"
      introspect_api: "api/introspect"
      client_id: "[INTRO_ID]"
      client_secret: "[INTRO_SECRET]"
      type: "online"

    - issuer: "[LOCAL]"
      key: "[KEY]"
      type: "local"
      algorithm: HS256
      client1:
        secret: "[SECRET1]"
        roles: ["user"]
      client2:
        secret: "[SECRET2]"
        roles: ["admin"]
      expire_minutes: 60

# ── LLM ──────────────────────────────────────────────────────────────────────
llm:
  providers:
    anthropic:
      api_key: "[ANTHROPIC_API_KEY]"
      default_model: "claude-sonnet-4-6"
      max_tokens: 8096
      kwargs:
        temperature: 0.9
        top_p: 0.95

    openai:
      api_key: "[OPENAI_API_KEY]"
      default_model: "gpt-4o"
      max_tokens: 8096
      kwargs:
        temperature: 0.9
        top_p: 0.95

    groq:
      api_key: "[GROQ_API_KEY]"
      default_model: "llama-3.3-70b-versatile"
      max_tokens: 8192
      kwargs:
        temperature: 0.9
        top_p: 0.95

    gemini:
      api_key: "[GEMINI_API_KEY]"
      default_model: "gemini-2.5-flash"
      max_tokens: 8192
      kwargs:
        temperature: 0.9
        top_p: 0.95

    generic:
      api_key: "[GENERIC_API_KEY]"
      default_model: "llama-3.3-70b-versatile"
      max_tokens: 8192
      openai_url: "https://api.groq.com/openai/v1/chat/completions"
      kwargs:
        temperature: 0.9
        top_p: 0.95

    # Sovereign / local – no external API calls
    ollama:
      base_url: "http://ollama:11434"  # use http://localhost:11434 for bare-metal
      default_model: "qwen2.5:0.5b"        # any model pulled via `ollama pull <model>`
      timeout_seconds: 120
      options:
        temperature: 0.9
        top_p: 0.95

  vector_database:
    # "weaviate" – self-hosted Docker (sovereign) or Weaviate Cloud
    # "qdrant"   – self-hosted Docker (sovereign) or Qdrant Cloud
    # "pinecone" – managed cloud only
    provider: "weaviate"

    # weaviate/qdrant: "http" (local Docker) | "cloud" | "embedded"/"memory"
    # pinecone: always cloud – only API_KEY required
    type: "http"

    http_host: "weaviate"   # Docker service name; use "localhost" for bare-metal
    http_port: 8080         # Weaviate default; Qdrant default is 6333
    grpc_port: 50051        # Weaviate gRPC port (v4 client requirement)

    cloud_host: "[CLUSTER_URL]"
    API_KEY: "[API_KEY]"

    N_RESULT: 2
    collection_name: "default_collection"

  embedding_model:
    # "openai" – requires API key, uses text-embedding-3-small
    # "local"  – sovereign, sentence-transformers on-device (no API key)
    #   local model options: "all-MiniLM-L6-v2" (fast, 384-dim)
    #                        "all-mpnet-base-v2" (accurate, 768-dim)
    #                        "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2" (African langs)
    provider: "openai"
    model: "text-embedding-3-small"
    API_KEY: "[OPENAI_API_KEY]"

  rate_limit:
    user: 10    # requests/minute for `user` role
    admin: 60   # requests/minute for `admin` role

  system_prompt_path: null  # path to YAML file containing SYSTEM_PROMPT: "..."

# ── Speech (STT + TTS shared providers) ──────────────────────────────────────
speech:
  max_file_size_mb: 50         # Groq, OpenAI, Deepgram
  spitch_max_file_size_mb: 25  # Spitch and Intron

  providers:
    groq:
      api_key: "[GROQ_API_KEY]"
    openai:
      api_key: "[OPENAI_API_KEY]"
    spitch:
      api_key: "[SPITCH_API_KEY]"
    deepgram:
      api_key: "[DEEPGRAM_API_KEY]"
    elevenlabs:
      api_key: "[ELEVENLABS_API_KEY]"
    intron:
      api_key: "[INTRON_API_KEY]"
      base_url: "https://api.intron.africa/v1"

# ── TTS ───────────────────────────────────────────────────────────────────────
tts:
  session_ttl_hours: 24  # Redis cache TTL for synthesized audio
  rate_limit:
    user: 10
    admin: 60

# ── STT ───────────────────────────────────────────────────────────────────────
stt:
  session_ttl_hours: 24  # Redis cache TTL for transcription results
  rate_limit:
    user: 10
    admin: 60

# ── Redis ─────────────────────────────────────────────────────────────────────
redis:
  enabled: false
  url: "[REDIS_URL]"  # e.g. "redis://localhost:6379/0"
  session_prefix: "session:"
  rate_limit_prefix: "rate_limit:"

# ── Chat / session history ────────────────────────────────────────────────────
chat:
  history_limit: 20       # max messages per session (oldest dropped first)
  session_ttl_hours: 24   # idle session lifetime in Redis (0 = no expiry)

# ── CORS ──────────────────────────────────────────────────────────────────────
cors:
  allow_origins: ["*"]   # restrict in production
  allow_methods: ["*"]
  allow_headers: ["*"]
  allow_credentials: true

# ── Document ingestion + RAG ──────────────────────────────────────────────────
document:
  pdf_folder: "./data/documents"
  image_folder: "./data/images"
  audio_folder: "./data/audio"
  max_file_size_mb: 50

  chunk_size: 512              # target characters per chunk
  chunk_overlap_sentences: 3   # sentences carried from previous chunk
  min_paragraph_length: 50     # shorter sentences discarded as noise

  ocr:
    # "tesseract" – fully local, requires Tesseract binary on the host
    # "llm"       – Claude or GPT-4o vision; higher quality, requires API key
    default_backend: "tesseract"
    tesseract_cmd: null         # override Tesseract binary path if not on PATH
    llm_provider: "anthropic"   # used when backend = "llm"

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  file: "log/app.log"
