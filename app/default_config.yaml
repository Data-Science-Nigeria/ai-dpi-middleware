app: 
  port: 8000
  name: "AI DPI Middleware"
  version: "0.1.0"
  debug: false

clients:
  # Example client configuration (client_id: {secret, roles})
  registry:
    client1:
      secret: "[secret1]"
      roles: ["user"]
    client2:
      secret: "[secret2]"
      roles: ["admin"]

oidc_config:
  use_oidc: false
  issuer: "https://your-oidc-provider.com"
  jwks_uri: "[jwks_uri]"
  audience: "[audience]"

oauth2_config:
  use_oauth2: false
  token_expire_minutes: 60
  client_credentials:
    client1:
      secret: "[secret1]"
      roles: ["user"]
    client2:
      secret: "[secret2]" 
      roles: ["admin"]
  oauth2_scopes:
    - name: "read"
      description: "Read access to resources"
    - name: "write"
      description: "Write access to resources"
  auth_endpoint: "/auth/token"
  token_endpoint: "/auth/token"
  redirect_uri: "https://your-app.com/callback"

llm:
  max_context_length: 131072  # Qwen 2.5 supports 32K context
  max_new_tokens: 8192  # Conservative output token limit
  temperature: 0.9 
  top_p: 0.95
  repetition_penalty: 1.05
  stop:
    - "<|im_end|>"
    - "<|end_of_text|>"

  providers:
    - model_name: "qwen/qwen2.5-7b-instruct"
      api_key: "[LLM_API_KEY]"  # Load from environment variable LLM_API_KEY
      provider: "local"  # Options: "local" (default), "api", "langchain", "langgraph".
      api_url: "http://localhost:8001/v1/llm"  # Used if provider is "api"

tts:
  session_ttl_hours: 24
  providers:
    - model_name: "tts/fastspeech2"
      api_key: "[TTS_API_KEY]"  # Load from environment variable TTS_API_KEY
      provider: "local"  # Options: "local" (default), "api", "langchain", "langgraph".
      api_url: "http://localhost:8002/v1/tts"  # Used if provider is "api"

stt:
  session_ttl_hours: 24
  providers:
    - model_name: "whisper-small"
      api_key: "[STT_API_KEY]"  # Load from environment variable STT_API_KEY
      provider: "local"  # Options: "local" (default), "api", "langchain", "langgraph".
      api_url: "http://localhost:8003/v1/stt"  # Used if provider is "api"

redis:
  enabled: false
  url: "[REDIS_URL]"  # Load from environment variable REDIS_URL, e.g. "redis://localhost:6379/0"
  session_prefix: "session:"
  rate_limit_prefix: "rate_limit:"

cors:
  allow_origins: ["*"]  # In production, specify allowed origins
  allow_methods: ["*"]
  allow_headers: ["*"]
  allow_credentials: true



# chroma_db:
#   path: "./chroma_db"
#   pdf_collection: "pdf_paragraphs"

# embedding:
#   model_path: "./model-s/African-Cross-Lingua-Embeddings-Model"
#   cross_encoder_path: "./model-s/ms-marco-MiniLM-L-6-v2"

document:
  pdf_folder: "./data/documents"
  min_paragraph_length: 50
  chunk_overlap_sentences: 3  # Number of sentences from previous chunk to include in next chunk
  image_folder: "./data/images"
  audio_folder: "./data/audio"
  enable_pdf_ocr: true     # Enable OCR for images inside PDFs
  extract_tables: false    # Placeholder for future table extraction

speech:
  whisper_model_path: "./model-s/whisper-small"
  sampling_rate: 16000
  confidence_threshold: 0.6
  use_segmentation: true
  language: "en"
  device: "auto" # "auto" for auto-detect, "cuda" for GPU, "cpu" for CPU
  max_file_size_mb: 50

rag:
  minimum_relevance_threshold: 0.5  # Minimum cross-encoder score for document relevance (0-1 scale)
  top_k: 10  # Number of candidates to retrieve before reranking
  rerank_k: 3  # Number of documents to return after reranking
  retrieval_presets:
    simple:  # For simple factual queries
      top_k: 5
      rerank_k: 2
    standard:  # Default balanced retrieval
      top_k: 10
      rerank_k: 3
    deep:  # For complex analytical queries
      top_k: 20
      rerank_k: 5

chat:
  history_limit: 10
  session_ttl_hours: 24

smart_chat:
  confidence_threshold: 0.7

security:
  enable_content_sanitization: true  # Sanitize retrieved content to prevent prompt injection
  strict_sanitization_mode: false  # If true, removes suspicious content; if false, logs warnings only
  # Rate Limiting (requests per minute)
  rate_limits:
    storage_uri: "memory://"         # Storage backend: "memory://" for in-memory, "redis://localhost:6379" for Redis (in production)
    global_default: 100          # Default limit for all endpoints
    upload_single: 10            # Single file upload limit
    upload_multi: 5              # Multi-file upload limit
    query_direct: 30             # Direct query limit
    query_rag: 30                # RAG query limit
    session_operations: 60       # Session CRUD operations limit
    stt_user: 10                 # STT requests per minute for `user` role
    stt_admin: 60                # STT requests per minute for `admin` role
  
  # File Upload Limits
  upload:
    max_file_size_mb: 50         # Maximum file size in megabytes
    allowed_extensions:          # Whitelist of allowed file extensions
      - .pdf
      - .docx
      - .doc
      - .txt
      - .rtf
      - .odt
      - .pptx
      - .ppt
      - .png
      - .jpg
      - .jpeg
      - .bmp
      - .tiff
      - .gif
      - .mp3
      - .wav
      - .flac
      - .aac
      - .ogg
      - .wma
      - .m4a
  
  # Allowed departments (whitelist)
  allowed_departments:
    - mosti
    - health
    - education
    - finance
    - "test"

logging:
  level: "INFO"
  file: "govllm.log"

image:
  min_paragraph_length: 50
  lang: "eng"
  tesseract_path: null
  enable_preprocessing: true
  enable_quality_validation: true
  quality_threshold: 0.2  # Fraction of "garbage" characters allowed

jwt:
  jwt_algorithm: "HS256"
  jwt_expire_minutes: 60
  jwt_secret_key: "[JWT_SECRET]"  # Load from environment variable JWT_SECRET_KEY