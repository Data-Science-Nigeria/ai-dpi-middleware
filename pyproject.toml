[project]
name = "ai-dpi-middleware"
version = "0.1.0"
description = "AI-powered Digital Public Infrastructure middleware"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "anthropic>=0.86.0",
    "deepgram-sdk>=7.1.1",
    "elevenlabs>=2.47.0",
    "fastapi>=0.135.2",
    "groq>=1.1.2",
    "httpx>=0.28.1",
    "jwt>=1.4.0",
    "loguru>=0.7.3",
    "openai>=2.30.0",
    "packaging>=26.0",
    "pinecone>=5.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.24",
    "qdrant-client>=1.12.0",
    "redis>=7.4.0",
    "spitch>=1.47.0",
    "uvicorn[standard]>=0.42.0",
    "weaviate-client>=4.9.0",
    # ── RAG / OCR pipeline ────────────────────────────────────────────────────
    "pymupdf>=1.24.0",           # PDF text extraction + page-to-image rendering
    "Pillow>=10.0.0",            # Image handling (required by pytesseract)
    "pytesseract>=0.3.13",       # Tesseract OCR wrapper (Tesseract binary must be installed separately)
    # ── Office / knowledge format extractors ─────────────────────────────────
    "python-docx>=1.1.0",        # DOCX / DOC extraction
    "python-pptx>=1.0.0",        # PPTX / PPT extraction (includes speaker notes)
    "openpyxl>=3.1.0",           # XLSX / XLS extraction
    "striprtf>=0.0.26",          # RTF extraction
    "odfpy>=1.4.1",              # ODT (OpenDocument Text) extraction
    # ── Schema-constrained extraction ────────────────────────────────────────
    "jsonschema>=4.23.0",            # JSON Schema validation for extraction output
    # ── Sovereign / local embedding ───────────────────────────────────────────
    "sentence-transformers>=3.0.0",  # Local embeddings – no API key required
    "google-genai>=2.6.0",
    "prometheus-client>=0.25.0",
]

[project.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "anyio>=4.0",
]

[tool.coverage.run]
# Emit repo-relative paths in coverage.xml so the dockerized SonarScanner
# (project mounted at /usr/src) can map coverage onto sources.
relative_files = true
source = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
